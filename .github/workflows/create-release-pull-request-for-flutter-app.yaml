name: Create release pull request for Flutter app

on:
  workflow_call:
    inputs:
      version:
        description: |
          Release version (e.g., 1.0.0)
          If not specified, the current release version is kept.
        required: false
        type: string
      build-number:
        description: |
          Build number after the update, not an increment (e.g., 672).
          Must be a positive integer greater than the current pubspec.yaml build number.
          If not specified or empty, the current build number is incremented by 1.
        required: false
        type: string
      branch-path-segment:
        description: |
          Additional path segment for release branch name (e.g., client, admin)
          If specified, the branch name will be: release/{branch-path-segment}/{version}
          If not specified, the branch name will be: release/{version}
          This is useful when managing multiple apps in a mono-repo to avoid branch name conflicts.
        required: false
        type: string
      working-directory:
        description: "For mono-repo, specify the directory."
        default: "./"
        type: string
    secrets:
      app-id:
        description: | 
          "GitHub App ID."
          "Required because Actions will not run on the pull request you create if you do not use the GitHub App."
        required: true
      private-key:
        description: |
          "GitHub App private key."
          "Required because Actions will not run on the pull request you create if you do not use the GitHub App."
        required: true

jobs:
  set-version-and-branch:
    name: Set version and branch name
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-output.outputs.version }}
      build-number: ${{ steps.set-output.outputs.build-number }}
      branch: ${{ steps.set-output.outputs.branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve pubspec metadata
        id: pubspec
        uses: altive/pubspec-metadata@v1
        with:
          pubspec-file: "${{ inputs.working-directory }}/pubspec.yaml"

      - name: Set input version to GITHUB_ENV
        if: ${{ inputs.version }}
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Set current version to GITHUB_ENV
        if: ${{ !inputs.version }}
        run: |
          echo "version=${{ steps.pubspec.outputs.version-number }}" >> "$GITHUB_ENV"

      - name: Set branch name to GITHUB_OUTPUT
        run: |
          if [ -n "${{ inputs.branch-path-segment }}" ]; then
            b="release/${{ inputs.branch-path-segment }}/${{ env.version }}"
          else
            b="release/${{ env.version }}"
          fi
          echo "branch=${b}" >> "$GITHUB_ENV"

      - name: Validate build number and set version and branch to GITHUB_OUTPUT
        id: set-output
        env:
          CURRENT_BUILD_NUMBER: ${{ steps.pubspec.outputs.build-number }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build-number }}
          RELEASE_VERSION: ${{ env.version }}
          RELEASE_BRANCH: ${{ env.branch }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          current = os.environ["CURRENT_BUILD_NUMBER"]
          requested = os.environ["REQUESTED_BUILD_NUMBER"]
          if not re.fullmatch(r"[0-9]+", current):
              fail("The current pubspec.yaml build number must be a non-negative integer.")
          current_number = int(current)

          if requested == "":
              build_number = current_number + 1
          else:
              if not re.fullmatch(r"[0-9]+", requested):
                  fail("build-number must be a positive integer containing only digits (0-9).")
              build_number = int(requested)
              if build_number <= 0:
                  fail("build-number must be a positive integer greater than 0.")
              if build_number <= current_number:
                  fail(f"build-number must be greater than the current pubspec.yaml build number ({current_number}).")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={os.environ['RELEASE_VERSION']}\n")
              output.write(f"build-number={build_number}\n")
              output.write(f"branch={os.environ['RELEASE_BRANCH']}\n")
          PY

  create-branch:
    name: Create release branch
    runs-on: ubuntu-latest
    needs: [set-version-and-branch]
    steps:
      - uses: actions/checkout@v4

      - name: Set branch name to GITHUB_ENV
        run: |
          echo "branch=${{ needs.set-version-and-branch.outputs.branch }}" >> "$GITHUB_ENV"

      - name: Set whether the branch is already existing to GITHUB_ENV
        run: |
          exists=$(
            git fetch origin ${{ env.branch }} &&
            echo true ||
            echo false
          )
          echo "branch_exists=${exists}" >> "$GITHUB_ENV"

      - name: Create release branch
        if: env.branch_exists == 'false'
        run: |
          git switch -c ${{ env.branch }}
          git push origin ${{ env.branch }}

  bump-version:
    name: Bump version and build number
    runs-on: ubuntu-latest
    needs: [set-version-and-branch, create-branch]
    env:
      version: ${{ needs.set-version-and-branch.outputs.version }}
      build-number: ${{ needs.set-version-and-branch.outputs.build-number }}
      branch: ${{ needs.set-version-and-branch.outputs.branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Switch branch
        run: |
          git fetch origin ${{ env.branch }}
          git switch ${{ env.branch }}

      - name: Bump version and build number
        run: |
          sed -i "s/^version:.*$/version:\ ${{ env.version }}\+${{ env.build-number }}/" ./pubspec.yaml
        working-directory: ${{ inputs.working-directory }}

      - name: Check diff
        run: |
          diff_count=$(git diff | wc -l)
          if [ "$diff_count" -ne 0 ]; then
              echo "has-diff=true" >> "$GITHUB_ENV"
          else
              echo "has-diff=false" >> "$GITHUB_ENV"
          fi

      - name: Git config
        if: env.has-diff == 'true'
        run: |
          git remote set-url origin "https://github-actions:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Commit & Push
        if: env.has-diff == 'true'
        run: |
          git add .
          git commit -m "build: bump app to ${{ env.version }}+${{ env.build-number }}"
          git push origin ${{ env.branch }}

  create-pr:
    name: Create Pull-Request for release
    runs-on: ubuntu-latest
    needs: [set-version-and-branch, bump-version]
    permissions:
      contents: write
      pull-requests: write
    env: 
      branch: ${{ needs.set-version-and-branch.outputs.branch }}
      version: ${{ needs.set-version-and-branch.outputs.version }}
      build-number: ${{ needs.set-version-and-branch.outputs.build-number }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.private-key }}

      - name: Create release PR
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          title: "build: bump app to ${{ env.version }}+${{ env.build-number }}"
          body: "This pull request was generated automatically by GitHub Actions."
        run: gh pr create -B "$GITHUB_REF" -H "${{ env.branch }}" -t "${{ env.title }}" -b "${{ env.body }}" -a "$GITHUB_ACTOR"
